[package]
name = "mockspace-extra-owed"
description = "Files a ticket for every placeholder marker that cites none, rewrites the marker to cite it, and closes the tickets whose markers are gone."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# the trait crate under the name the generated collector gives it; the engine patches every spelling
# of it to the one it is built from
mockspace.workspace = true
registry-lints.workspace = true
# the writing of a ticket, the reading of the registry, and the notice of a tree behind the trunk
tickets.workspace = true
ticket-model.workspace = true
mockspace-registry.workspace = true

[dev-dependencies]
tickets = { workspace = true, features = ["testkit"] }
