[package]
name = "unearth"
description = "Says what the research, the rounds and op's words hold about a subject, ranked, with the registry's keywords folded in."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# the trait crate under the name the generated collector gives it; the engine patches every spelling
# of it to the one it is built from
mockspace = { package = "mockspace-lint-rules", git = "ssh://git@github.com/hiisi-digital/mockspace.git", branch = "dev" }
corpus = { path = "../corpus" }
# the index the query tools ask, which is muisti's: private, so spelled over ssh
muisti = { git = "ssh://git@github.com/orgrinrt/muisti", branch = "dev", default-features = false }
