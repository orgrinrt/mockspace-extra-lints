[package]
name = "mockspace-extra-already-said"
description = "Says which rows already carry a term and how much of the corpus does, before a question reaches the maintainer."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# the trait crate under the name the generated collector gives it; the engine patches every spelling
# of it to the one it is built from
mockspace.workspace = true
# the search over the research, the rounds and the maintainer's words, because a registry answer alone is what
# licenses asking the maintainer a question the research already settled
corpus.workspace = true
# the index the query tools ask, which is muisti's: private, so spelled over ssh
muisti.workspace = true
# the notice of a tree that has fallen behind the trunk
tickets.workspace = true
