[package]
name = "already-said"
description = "Says which rows already carry a term and how much of the corpus does, before a question reaches op."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# the trait crate under the name the generated collector gives it; the engine patches every spelling
# of it to the one it is built from
mockspace = { package = "mockspace-lint-rules", git = "ssh://git@github.com/hiisi-digital/mockspace.git", branch = "dev" }
# the search over the research, the rounds and op's words, because a registry answer alone is what
# licenses asking op a question the research already settled
corpus = { path = "../corpus" }
# the index the query tools ask, which is muisti's: private, so spelled over ssh
muisti = { git = "ssh://git@github.com/orgrinrt/muisti", branch = "dev", default-features = false }
# the notice of a tree that has fallen behind the trunk
tickets = { path = "../tickets" }
