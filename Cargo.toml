[package]
name = "mockspace-extra-lints"
version = "0.1.0"
edition = "2021"
description = "Opt-in mockspace lint pack: the rules that only make sense once a project has picked its foundations, and a ticket and canon workflow kept in the registry"
license = "MPL-2.0"
repository = "https://github.com/orgrinrt/mockspace-extra-lints"
publish = false

[dependencies]
# Committed state points at the canonical mockspace repo. For local
# iteration, use `[patch]` in `.cargo/config.toml` to redirect.
#
# The URL spelling has to match the one the engine pins, character for
# character. Cargo keys a git source by its URL, so `ssh://` here against
# the `https://` the engine writes into its generated lint crate is two
# copies of one crate in one graph, and what surfaces is a type mismatch
# between `LintPack` and `LintPack` at the same file and the same line,
# with nothing in the error naming the cause. The engine's generated
# manifest also carries a `[patch]` keyed on the `https://` spelling,
# which covers this crate only once the two agree.
# FIXME(point_the_pack_back_at_mockspace_dev_once_the_tool_carrier_l): `work/extension-carriers`
# carries `Tool::config_keys` and `Tool::configure`, which `tackle` reads; the four mockspace
# lines go back to `dev` once it lands there.
mockspace-lint-rules = { git = "https://github.com/hiisi-digital/mockspace.git", branch = "work/extension-carriers" }
tree-sitter = "0.24"
tree-sitter-rust = "0.23.3"
# `re-export-foreign-names` reads the surface of a re-exported type out of the
# dependency that declares it, and `cargo metadata` is what says where that
# dependency's source is: a git revision, a path and a `[patch]` all end at a
# manifest path there and nowhere else reliably.
serde_json = "1"
toml = "0.8"
# Reads a manifest with the spans of its keys, which the findings' line numbers come from. The engine's
# own `toml_edit` is the older 0.22, so the lockfile holds both.
toml_edit = "0.25"

# The workflow tools and the lints over the ticket, tenet and subject rows, each a crate of
# `crates/`, reached only with the `workflow` feature.
mockspace-extra-registry-lints = { path = "crates/registry-lints", optional = true }
mockspace-extra-already-said = { path = "crates/tools/already-said", optional = true }
mockspace-extra-build-weigh = { path = "crates/tools/build-weigh", optional = true }
mockspace-extra-canon = { path = "crates/tools/canon", optional = true }
mockspace-extra-canon-links = { path = "crates/tools/canon-links", optional = true }
mockspace-extra-corpus = { path = "crates/tools/corpus", optional = true }
mockspace-extra-finish = { path = "crates/tools/finish", optional = true }
mockspace-extra-intent-or-mechanism = { path = "crates/tools/intent-or-mechanism", optional = true }
mockspace-extra-known-red = { path = "crates/tools/known-red", optional = true }
mockspace-extra-owed = { path = "crates/tools/owed", optional = true }
mockspace-extra-parallel-statements = { path = "crates/tools/parallel-statements", optional = true }
mockspace-extra-quote-check = { path = "crates/tools/quote-check", optional = true }
mockspace-extra-research-unbundle = { path = "crates/tools/research-unbundle", optional = true }
mockspace-extra-tackle = { path = "crates/tools/tackle", optional = true }
mockspace-extra-test-list = { path = "crates/tools/test-list", optional = true }
mockspace-extra-ticket-add = { path = "crates/tools/ticket-add", optional = true }
mockspace-extra-ticket-move = { path = "crates/tools/ticket-move", optional = true }
mockspace-extra-tickets = { path = "crates/tools/tickets", optional = true }
mockspace-extra-unearth = { path = "crates/tools/unearth", optional = true }

[features]
# Off unless a consumer names it in its `[lint-crates]` entry. A consumer that keeps its own copy of
# one of these tools would otherwise register the name twice, and the engine refuses every tool run
# while a name is registered twice.
workflow = [
    "dep:mockspace-extra-registry-lints",
    "dep:mockspace-extra-already-said",
    "dep:mockspace-extra-build-weigh",
    "dep:mockspace-extra-canon",
    "dep:mockspace-extra-canon-links",
    "dep:mockspace-extra-corpus",
    "dep:mockspace-extra-finish",
    "dep:mockspace-extra-intent-or-mechanism",
    "dep:mockspace-extra-known-red",
    "dep:mockspace-extra-owed",
    "dep:mockspace-extra-parallel-statements",
    "dep:mockspace-extra-quote-check",
    "dep:mockspace-extra-research-unbundle",
    "dep:mockspace-extra-tackle",
    "dep:mockspace-extra-test-list",
    "dep:mockspace-extra-ticket-add",
    "dep:mockspace-extra-ticket-move",
    "dep:mockspace-extra-tickets",
    "dep:mockspace-extra-unearth",
]

[dev-dependencies]
tempfile = "3"
# The pack itself with the workflow on, so a plain `cargo test` builds and runs the scratch consumer of
# `tests/a_consumer_runs_the_workflow.rs`. Only a test build takes it; a consumer's `[lint-crates]` entry
# still gets the feature only by naming it.
mockspace-extra-lints = { path = ".", features = ["workflow"] }
# The engine's own config reader, so a test can load a `mockspace.toml` the way a run does.
# The same URL spelling as above, for the reason given there.
mockspace = { git = "https://github.com/hiisi-digital/mockspace.git", branch = "work/extension-carriers" }

[workspace]
members = [".", "crates/registry-lints", "crates/ticket-model", "crates/planning", "crates/tools/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
# The trait crate under the name the moved crates use for it, `mockspace`, and the root's spelling of
# it, for the reason given on the root's own dependency above.
mockspace = { package = "mockspace-lint-rules", git = "https://github.com/hiisi-digital/mockspace.git", branch = "work/extension-carriers" }
# The registry's own slug rule, which an id is held to.
mockspace-registry = { git = "https://github.com/hiisi-digital/mockspace.git", branch = "work/extension-carriers" }
# Private, so spelled ssh: over https git waits for a credential nobody supplies.
muisti = { git = "ssh://git@github.com/orgrinrt/muisti", branch = "dev", default-features = false }
toml = "1"
registry-lints = { package = "mockspace-extra-registry-lints", path = "crates/registry-lints" }
ticket-model = { package = "mockspace-extra-ticket-model", path = "crates/ticket-model" }
planning = { package = "mockspace-extra-planning", path = "crates/planning" }
canon = { package = "mockspace-extra-canon", path = "crates/tools/canon" }
corpus = { package = "mockspace-extra-corpus", path = "crates/tools/corpus" }
tickets = { package = "mockspace-extra-tickets", path = "crates/tools/tickets" }
